name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=sqlite_fts5,sqlite_omit_load_extension
      GOCACHE: /tmp/mithra-build-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Verify formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Verify reset across installer and service identities
        run: sudo env "PATH=$PATH" "GOFLAGS=$GOFLAGS" GOCACHE=/tmp/mithra-root-test-cache go test -count=1 ./cmd/mithra-installer -run '^TestResetDemoRealServiceOwnedTree$' -v
      - run: go build -trimpath ./cmd/mithra
      - run: go build -trimpath ./cmd/mithra-installer
      - run: sh -n deploy/install.sh
      - run: find web/static -type f -name '*.js' -print0 | LC_ALL=C sort -z | xargs -0 -r -n1 node --check
      - run: find web/static -type f -name '*.test.mjs' -print0 | LC_ALL=C sort -z | xargs -0 -r node --test
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  container:
    runs-on: ubuntu-latest
    env:
      MITHRA_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the test suite against SQLCipher
        run: docker build --target test .
      - name: Build the runtime image
        run: docker build --build-arg VERSION="$MITHRA_VERSION" -t "mithra:$MITHRA_VERSION" .
      - name: Start the compose stack with throwaway credentials
        run: |
          secrets="$RUNNER_TEMP/mithra-secrets"
          mkdir -p "$secrets"
          docker run --rm "mithra:$MITHRA_VERSION" generate-master-key > "$secrets/master.key"
          printf 'sk_ci_placeholder' > "$secrets/plunk.key"
          # Mithra accepts secret mounts owned by root or its own uid, as on
          # a Dokploy host; the runner user owns neither.
          chmod 0644 "$secrets"/*.key
          sudo chown root:root "$secrets"/*.key
          cat > "$RUNNER_TEMP/mithra.env" <<ENV
          ALLOWED_EMAILS=owner@example.com,partner@example.com
          MITHRA_CANONICAL_ORIGIN=https://mithra.ci.invalid
          MITHRA_PLUNK_FROM=Mithra <hello@mithra.ci.invalid>
          MITHRA_TRUSTED_PROXIES=172.16.0.0/12
          MITHRA_MASTER_KEY_PATH=$secrets/master.key
          MITHRA_PLUNK_KEY_PATH=$secrets/plunk.key
          ENV
          docker compose --env-file "$RUNNER_TEMP/mithra.env" up -d --no-build --wait --wait-timeout 120
      - name: Smoke-test health, the sandboxed parser, and a restart
        run: |
          compose="docker compose --env-file $RUNNER_TEMP/mithra.env"
          healthz() { docker run --rm --network mithra_default curlimages/curl:8.11.1 -fsS http://app:8080/healthz; }
          healthz
          $compose exec -T app mithra pdf-parser-probe --sample
          $compose exec -T app mithra status | tee "$RUNNER_TEMP/status.txt"
          grep -qx 'database=encrypted' "$RUNNER_TEMP/status.txt"
          test "$(docker inspect mithra-pdf-parser-1 --format '{{.HostConfig.NetworkMode}}')" = none
          $compose restart app
          $compose up -d --no-build --wait --wait-timeout 120
          healthz
          $compose exec -T app mithra pdf-parser-probe --sample
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/mithra.env" logs --no-color || true
      - name: Remove the stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/mithra.env" down -v || true
