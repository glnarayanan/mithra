{{define "notfound.html"}}
<!doctype html>
<html lang="en">
  <head>
    {{if .Navigation}}{{template "head"}}{{else}}{{template "head-public"}}{{end}}
    <title>Not found · Mithra</title>
  </head>
  <body class="{{if .Navigation}}authenticated-shell{{else}}public-shell{{end}}">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {{if .Navigation}}{{template "app-shell" .}}{{end}}
    <main id="main-content" tabindex="-1" class="page">
      <section class="empty not-found" aria-labelledby="not-found-title">
        <h1 id="not-found-title">{{.Title}}</h1>
        <p>{{.Copy}}</p>
        <p><a class="button button-primary" href="{{.BackURL}}">{{.BackLabel}}</a></p>
      </section>
    </main>
  </body>
</html>
{{end}}
